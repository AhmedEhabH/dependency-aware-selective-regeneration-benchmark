# Scientific Smoke V2 — Minimal Real Kaggle Smoke (three-arm core experiment)
# 1 repository (todo) x 3 frozen scenarios x 3 arms x 1 run = 9 total runs
# Backend: kaggle-qwen (Qwen2.5-Coder on Kaggle GPU)
# Arms: monolithic (full_scope_reference), selective (hybrid_selective), iterative_repository_agent
# Frozen scenario IDs: todo-smoke-001, todo-smoke-002, todo-smoke-003
# Non-publication engineering/scientific harness smoke evidence.
# Evidence tier: smoke (valid EvidenceTier enum value).

profile_label: scientific-smoke-v2
protocol_version: "1.0"
execution_mode: kaggle

strategies:
  - name: monolithic
  - name: selective
  - name: iterative_repository_agent

backends:
  - name: qwen
    kind: kaggle_qwen
    params:
      model_name: Qwen/Qwen2.5-Coder-7B-Instruct

repositories:
  - name: todo
    url: https://github.com/ahmed-ehab/controlled-django-todo
    ref: b8a33e20bdaf5b329114273063fbe8d5aa66e9cf

scenario_selection:
  repository_names:
    - todo
  scenario_ids:
    - todo-smoke-001
    - todo-smoke-002
    - todo-smoke-003
  blast_radii:
    - localized
    - moderate
    - cross_cutting

execution:
  max_iterations: 3
  max_tokens: 0
  # Smoke-only cap: controlled files are small, real successful completions
  # stayed under 400 tokens, and the cap preserves T4 headroom for the
  # repeated in-process calls. Pilot/Research limits are not altered.
  max_completion_tokens_per_call: 1024
  max_total_workflow_tokens: 0
  timeout_seconds: 300
  random_seed: 42
  evidence_tier: smoke

output:
  output_dir: runs/scientific_smoke_v2
  format: jsonl
  write_provenance: true
