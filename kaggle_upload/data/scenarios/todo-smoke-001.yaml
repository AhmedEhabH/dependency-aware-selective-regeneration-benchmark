# Scenario — todo-smoke-001
# Protocol v1.0 (FROZEN) — three-arm core experiment smoke change

scenario_id: "todo-smoke-001"
repository: todo
change_type: "Schema and field changes"
blast_radius: localized
requirement_before: >
  The Task model already has owner (nullable ForeignKey), project (ForeignKey
  to Project), and tags (ManyToManyField to Tag). The Task model does not
  have a priority field. The TaskSerializer does not expose priority. The
  TaskViewSet currently has no priority filter parameter. There is no
  priority concept anywhere in the codebase.
requirement_after: >
  The Task model must gain a Priority enum implemented with Django
  TextChoices. The allowed stored values are HIGH, MEDIUM, LOW. The
  default priority is MEDIUM. The TaskSerializer must expose priority as a
  writable field. The list endpoint must support filtering by priority via
  GET /api/tasks/?priority=HIGH. Requests without the priority query
  parameter must retain the current unfiltered listing behaviour. Existing
  Task.owner, Task.tags, Project and Tag behaviour must be preserved.
rationale: >
  Smoke scenario 1 — localized model + serializer + view change. Tests whether
  each strategy correctly identifies the affected files for a straightforward
  field addition with controlled blast radius. Reuses the same requirement
  content as todo-loc-001 under a dedicated smoke scenario ID.
acceptance_criteria:
  - "Task model has priority field with choices HIGH, MEDIUM, LOW and default MEDIUM"
  - "TaskSerializer exposes priority field as a read-write ChoiceField"
  - "Task list endpoint supports ?priority=HIGH filtering"
  - "Unfiltered listing behaviour is unchanged"
  - "All existing tests pass without modification"
expected_affected_artifacts:
  - "todo/models.py:add Task.Priority and priority field"
  - "todo/serializers.py:expose priority"
  - "todo/views.py:add optional priority query filtering"
  - "todo/migrations/:create exactly one migration"
expected_actions:
  "todo/models.py": modify
  "todo/serializers.py": modify
  "todo/views.py": modify
  "todo/migrations/": create
regression_obligations:
  - "todo/tests/test_models.py"
  - "todo/tests/test_views.py"
  - "todo/tests/test_serializers.py"
architecture_constraints:
  - "Priority choices must be an Enum on the Task model, not a separate model"
  - "Default priority must be MEDIUM, not HIGH or LOW"
  - "Exactly one new migration must be generated by Django makemigrations; existing migration files must remain unchanged"
  - "No changes to todo/urls.py, todo/permissions.py, Project, or Tag"
  - "Priority filtering must be in the view, not the serializer"
evaluator_asset: "tests/evaluator_assets/todo_smoke_001_checks.py"
post_generation_command:
  - python
  - manage.py
  - makemigrations
  - todo
  - --noinput
require_new_migration: true
hidden_tests:
  - description: "Regression test: existing Task fields (title, description, status, project, created_at, updated_at) remain fully functional"
    type: regression
  - description: "Changed-requirement test: creating a task with priority='URGENT' (invalid) returns 400"
    type: changed_requirement
  - description: "Regression test: Project model and Tag model are completely unaffected"
    type: regression
