# Scientific Smoke V1 — Minimal Real Kaggle Smoke
# 1 repository × 1 scenario × 3 arms × 1 run = 3 total runs
# Backend: kaggle-qwen (Qwen2.5-Coder on Kaggle GPU)
# Arms: full_scope_reference (monolithic), hybrid_selective (selective), iterative_repository_agent
# Non-publication engineering/scientific harness smoke evidence.
# See SELECTIVE_UPDATES/records/SCIENTIFIC-SMOKE-V1.md

profile_label: scientific-smoke-v1
protocol_version: "1.0"
execution_mode: kaggle

strategies:
  - name: monolithic
  - name: selective
  - name: iterative_repository_agent

backends:
  - name: qwen
    kind: kaggle_qwen
    params:
      model_name: qwen2.5-coder

repositories:
  - name: todo
    url: https://github.com/ahmed-ehab/controlled-django-todo
    ref: main

scenario_selection:
  repository_names:
    - todo
  blast_radii:
    - localized
  count: 1

execution:
  max_iterations: 2
  max_tokens: 4096
  timeout_seconds: 180
  random_seed: 42
  evidence_tier: scientific_smoke_v1
  repetitions: 1

output:
  output_dir: runs/scientific_smoke_v1
  format: jsonl
  write_provenance: true
  is_publication: false
