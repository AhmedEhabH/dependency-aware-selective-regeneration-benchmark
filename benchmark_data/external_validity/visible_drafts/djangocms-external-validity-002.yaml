repository: djangocms
requirement_after: A public utility function `get_page_content_by_language(page, language_code)`
  is added to a relevant module. It accepts a Page instance and a language code string,
  returns the PageContent for that page+language combination, and raises PageContent.DoesNotExist
  if no matching content exists. The function is documented with a docstring and optionally
  re-exported via __all__.
requirement_before: There is no convenience function in a relevant module to retrieve
  a PageContent instance given a Page and a language code. Callers must manually query
  PageContent.objects.get(page=page, language=code) or traverse Page.pagecontent_set.
