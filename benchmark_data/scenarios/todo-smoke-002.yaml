# Scenario — todo-smoke-002
# Protocol v1.0 (FROZEN) — three-arm core experiment smoke change

scenario_id: "todo-smoke-002"
repository: todo
change_type: "Schema and field changes"
blast_radius: moderate
requirement_before: >
  Tasks are permanently deleted when a DELETE request is sent to the API.
  There is no mechanism to recover deleted tasks. The Task model has no
  concept of soft deletion, archived status, or deleted_at timestamp.
  The default Task queryset returns all tasks including deleted ones.
requirement_after: >
  The Task model must gain soft deletion: a deleted_at DateTimeField that
  is null by default. When a DELETE request is received, the task's
  deleted_at field is set to the current timestamp instead of being removed
  from the database. Normal API listing endpoints (GET /api/tasks/) must
  exclude soft-deleted tasks by default. A detail=False DRF @action named
  deleted must list only soft-deleted tasks. A detail=True DRF @action
  named restore must set deleted_at back to null, restoring the task.
  Soft-deleted tasks retain all their existing data (title, description,
  status, project, tags). Attempting to access a soft-deleted task by ID
  returns 404. Serializer changes are not required. DefaultRouter exposes
  both actions automatically so todo/urls.py must not be modified.
rationale: >
  This is a cross-layer change: model (new field, custom queryset),
  views (new list and action endpoints), and migrations. Serializer changes
  are not required. URL configuration changes are not required because
  DefaultRouter exposes @action methods automatically.
acceptance_criteria:
  - "DELETE /api/tasks/{id}/ sets deleted_at instead of removing the row"
  - "GET /api/tasks/ excludes soft-deleted tasks by default"
  - "GET /api/tasks/{id}/ returns 404 for soft-deleted tasks"
  - "GET /api/tasks/deleted/ lists only soft-deleted tasks"
  - "POST /api/tasks/{id}/restore/ sets deleted_at=null and returns the restored task"
  - "Soft-deleted tasks retain all original data after restore"
expected_affected_artifacts:
  - "todo/models.py:add deleted_at and soft-deletion queryset or manager"
  - "todo/views.py:implement soft delete, deleted action and restore action"
  - "todo/migrations/:create exactly one migration"
expected_actions:
  "todo/models.py": modify
  "todo/views.py": modify
  "todo/migrations/": create
regression_obligations:
  - "todo/tests/test_models.py"
  - "todo/tests/test_serializers.py"
  - "todo/tests/test_views.py"
  - "todo/tests/test_permissions.py"
architecture_constraints:
  - "Soft deletion must use deleted_at field, not an is_deleted boolean"
  - "Default queryset must filter out soft-deleted tasks at the model manager level"
  - "deleted and restore must be DRF @action methods on TaskViewSet"
  - "todo/urls.py must remain unchanged because DefaultRouter exposes actions"
  - "exactly one new migration must be generated"
  - "existing migrations must remain byte-identical"
  - "Project and Tag behaviour must remain unchanged"
  - "No changes to serializers, permissions, Project model, or Tag model"
hidden_tests:
  - description: "Soft-deleted task can be restored and is fully functional afterward"
    type: changed_requirement
  - description: "Soft-deleted task fields (title, description, status, project) are preserved"
    type: changed_requirement
  - description: "Normal CRUD for Project and Tag is unaffected"
    type: regression
